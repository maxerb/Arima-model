[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arima-snb"
version = "0.1.0"
description = "Replication of the SNB's disaggregate ARIMA inflation model (Huwiler & Kaufmann 2013)"
requires-python = ">=3.12"
# Exact versions are pinned in requirements.txt; these are the direct dependencies.
dependencies = ["pandas", "numpy", "scipy", "statsmodels", "openpyxl", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
